# Serve the static site and proxy /api/ to the resolver on the same origin.
limit_req_zone $binary_remote_addr zone=gift:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name play.medal.poker;
    # ssl_certificate / ssl_certificate_key …

    root /srv/medal;                   # a checkout of github.com/futuresauce/medal (the repo root is the site)
    index index.html;

    location /api/ {
        limit_req zone=gift burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # clean URLs: every other path serves the app
    location / { try_files $uri $uri/ /index.html; }
}
